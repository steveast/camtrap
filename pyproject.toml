[project]
name = "camtrap"
version = "0.1.0"
description = "Laptop camera trap: motion snapshots, off-box upload, two-stage audible response"
requires-python = ">=3.12"
dependencies = ["opencv-python-headless>=4.10", "numpy>=1.26"]

[project.scripts]
camtrap = "camtrap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
